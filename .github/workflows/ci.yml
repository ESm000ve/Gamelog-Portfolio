name: Project checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:publication
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:ui
        env:
          GAMELOG_TEST_PRODUCTION: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-screenshots
          path: test-results/portfolio-screenshots-*/0*.png
          if-no-files-found: error
